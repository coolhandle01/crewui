[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crewui"
version = "0.1.0"
description = "A Textual TUI for sequential CrewAI pipelines"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "crewai",
    "crewai-tools",
    "textual",
    "tui",
    "terminal",
    "console",
    "ai-agents",
    "agentic",
    "pipeline",
    "observability",
    "monitoring",
]
authors = [{ name = "Nathan Bottomley-Cook" }]
# No "License :: OSI Approved ::" classifier: the SPDX `license` field above is
# the modern source of truth, and setuptools>=77 rejects pairing the two. Per-
# version Python classifiers are a promise - they match the tests.yml matrix
# (3.10-3.13) exactly. "Typing :: Typed" is earned by the shipped py.typed.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
    "Typing :: Typed",
]

# Two runtime dependencies, and only two. crewui is a thin presentation layer:
# it renders a CrewAI Crew in a Textual App and nothing more. Everything
# domain-specific is injected by the host through callbacks, so nothing else
# belongs here.
#
# crewai is pinned to <1.16 rather than left open because the human-input
# routing leans on crewai.core.providers.human_input - a semi-internal API
# (the one place crewui reaches past the public surface, isolated in app.py).
# A minor bump is a review event: re-check that seam, then move the ceiling.
# The floor is 1.15.6, the first release where the executor's
# ask_for_human_input compat property is back (a 1.14.5 regression crashed
# human_input; see the fork note in README).
dependencies = [
    "crewai>=1.15.6,<1.16",
    "textual>=0.60",
]

[project.optional-dependencies]
# Development only - none of this is imported by crewui at runtime.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",  # drives the textual.pilot harness for the App tests
    "mypy>=1.11",
    "pylint>=3.2",
    # Pinned exactly: a floating linter turns a new upstream rule into a red
    # main, which is not a signal about this repository.
    "ruff==0.16.0",
]

[project.scripts]
crewui = "crewui.cli:main"

[project.urls]
Homepage = "https://github.com/coolhandle01/crewui"
Issues = "https://github.com/coolhandle01/crewui/issues"

[tool.setuptools.packages.find]
include = ["crewui*"]

# Ship the typing marker and the default stylesheet inside the wheel. Without
# py.typed a consumer gets Any instead of crewui's annotations; without the
# .tcss the App's CSS_PATH resolves to a file that is not in the install.
[tool.setuptools.package-data]
crewui = ["py.typed", "*.tcss"]

# Commit messages are Conventional Commits and CI checks them. `cz bump` keeps
# crewui/__init__.py's __version__ in step with [project].version, which are
# otherwise two places declaring the same number.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["crewui/__init__.py:__version__"]
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# app.py reaches app._await_feedback (a name-mangled-adjacent internal) from the
# provider factory and the log handler; that private coupling is the documented
# injection seam, not a smell to refactor.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage flags are deliberately NOT in addopts. The sdist ships this suite so
# a downstream packager can verify the build they are shipping with plain
# pytest; the gate lives in the CI invocation instead (see tests.yml).

[tool.coverage.run]
branch = true
source = ["crewui"]
# __main__.py is the `python -m crewui` entry point: an import and a guard that
# is false whenever the module is imported. It is verified against the built
# wheel in release.yml and the bare install in tests.yml, where an entry-point
# regression would actually surface - measuring it here would only report 0%.
omit = ["crewui/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["crewui"]
# crewai does not ship usable stubs, and following its imports drags in numpy's
# PEP-695 stubs, which mypy pinned to the 3.10 floor cannot parse. Skip the
# descent into both rather than pin mypy to a newer interpreter than the floor
# it is checking against.
[[tool.mypy.overrides]]
module = ["crewai.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pylint.main]
# Ratchet, not an aspiration. Set just under the score the tree scores today
# (10.00) so it catches regression rather than demanding an immediate refactor.
fail-under = 9.9
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    # Ruff owns style; pylint is here for the design and length checks.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    # Optional/heavy imports (textual, crewai providers, the demo) are imported
    # lazily and inside methods on purpose - to keep `crewui --version` cheap
    # and to isolate the semi-internal crewai provider seam to one place.
    "import-outside-toplevel",
    # The App's log handler and provider factory reach app._write_agent /
    # app._await_feedback across the class boundary; that private coupling is
    # the documented human-input injection seam.
    "protected-access",
    # Textual's App exposes a broad surface; the TUI subclass legitimately
    # carries one attribute per injected callback and widget group.
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    # Fire-and-forget telemetry callbacks (step/task/on_complete) deliberately
    # swallow any exception so a rendering hiccup never takes the run down.
    "broad-exception-caught",
    # The human-input provider must keep crewai's ``output_to_review`` parameter
    # name so crewai can pass it by keyword, but ignores it (the step-callback
    # already streamed that text into the agent pane).
    "unused-argument",
]
